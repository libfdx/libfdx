[versions]
libfdxGroup = "io.github.libfdx"
libfdxRelease = "0.0.2"
libfdxSnapshot = "-SNAPSHOT"

easyPublishing = "0.1.2"
androidGradlePlugin = "9.1.1"
jwebgpu = "0.3.4"
jmultiplatform = "0.1.3"
junitJupiter = "5.13.4"
junitPlatform = "1.13.4"
javaWebsocket = "1.5.7"
lwjgl = "3.4.1"
teavm = "0.15.0"
usePublishedLibfdx = "true"
webrtcAndroid = "137.7151.05"
webrtcJava = "0.14.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
easyPublishing = { id = "com.github.xpenatan.easy-publishing", version.ref = "easyPublishing" }

[libraries]
jwebgpu-android = { module = "com.github.xpenatan.jWebGPU:webgpu-android-wgpu", version.ref = "jwebgpu" }
jwebgpu-core = { module = "com.github.xpenatan.jWebGPU:webgpu-core", version.ref = "jwebgpu" }
jwebgpu-ffm = { module = "com.github.xpenatan.jWebGPU:webgpu-desktop-ffm", version.ref = "jwebgpu" }
jwebgpu-ffm-windows-x64 = { module = "com.github.xpenatan.jWebGPU:webgpu-desktop-ffm-wgpu_windows_x64", version.ref = "jwebgpu" }
jwebgpu-ffm-linux-x64 = { module = "com.github.xpenatan.jWebGPU:webgpu-desktop-ffm-wgpu_linux_x64", version.ref = "jwebgpu" }
jwebgpu-ffm-mac-x64 = { module = "com.github.xpenatan.jWebGPU:webgpu-desktop-ffm-wgpu_mac_x64", version.ref = "jwebgpu" }
jwebgpu-ffm-mac-arm64 = { module = "com.github.xpenatan.jWebGPU:webgpu-desktop-ffm-wgpu_mac_arm64", version.ref = "jwebgpu" }
jwebgpu-jni = { module = "com.github.xpenatan.jWebGPU:webgpu-jni", version.ref = "jwebgpu" }
jwebgpu-jni-desktop = { module = "com.github.xpenatan.jWebGPU:webgpu-desktop-jni", version.ref = "jwebgpu" }
jwebgpu-jni-windows-x64 = { module = "com.github.xpenatan.jWebGPU:webgpu-desktop-jni-wgpu_windows_x64", version.ref = "jwebgpu" }
jwebgpu-jni-linux-x64 = { module = "com.github.xpenatan.jWebGPU:webgpu-desktop-jni-wgpu_linux_x64", version.ref = "jwebgpu" }
jwebgpu-jni-mac-x64 = { module = "com.github.xpenatan.jWebGPU:webgpu-desktop-jni-wgpu_mac_x64", version.ref = "jwebgpu" }
jwebgpu-jni-mac-arm64 = { module = "com.github.xpenatan.jWebGPU:webgpu-desktop-jni-wgpu_mac_arm64", version.ref = "jwebgpu" }
jwebgpu-web = { module = "com.github.xpenatan.jWebGPU:webgpu-web", version.ref = "jwebgpu" }
jwebgpu-web-wasm = { module = "com.github.xpenatan.jWebGPU:webgpu-web_wasm", version.ref = "jwebgpu" }
jmultiplatform = { module = "com.github.xpenatan:jMultiplatform", version.ref = "jmultiplatform" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
java-websocket = { module = "org.java-websocket:Java-WebSocket", version.ref = "javaWebsocket" }
lwjgl = { module = "org.lwjgl:lwjgl", version.ref = "lwjgl" }
lwjgl-freetype = { module = "org.lwjgl:lwjgl-freetype", version.ref = "lwjgl" }
lwjgl-glfw = { module = "org.lwjgl:lwjgl-glfw", version.ref = "lwjgl" }
lwjgl-opengl = { module = "org.lwjgl:lwjgl-opengl", version.ref = "lwjgl" }
lwjgl-vulkan = { module = "org.lwjgl:lwjgl-vulkan", version.ref = "lwjgl" }
teavm-interop = { module = "org.teavm:teavm-interop", version.ref = "teavm" }
teavm-gradle-plugin = { module = "org.teavm:teavm-gradle-plugin", version.ref = "teavm" }
teavm-tooling = { module = "org.teavm:teavm-tooling", version.ref = "teavm" }
teavm-classlib = { module = "org.teavm:teavm-classlib", version.ref = "teavm" }
teavm-extension-spi = { module = "org.teavm:teavm-extension-spi", version.ref = "teavm" }
teavm-jso = { module = "org.teavm:teavm-jso", version.ref = "teavm" }
teavm-jso-apis = { module = "org.teavm:teavm-jso-apis", version.ref = "teavm" }
teavm-jso-impl = { module = "org.teavm:teavm-jso-impl", version.ref = "teavm" }
webrtc-android = { module = "io.github.webrtc-sdk:android", version.ref = "webrtcAndroid" }
webrtc-java = { module = "dev.onvoid.webrtc:webrtc-java", version.ref = "webrtcJava" }

[bundles]
jwebgpu-desktop-ffm = [
    "jwebgpu-ffm",
    "jwebgpu-ffm-windows-x64",
    "jwebgpu-ffm-linux-x64",
    "jwebgpu-ffm-mac-x64",
    "jwebgpu-ffm-mac-arm64",
]
jwebgpu-desktop-jni = [
    "jwebgpu-jni",
    "jwebgpu-jni-desktop",
    "jwebgpu-jni-windows-x64",
    "jwebgpu-jni-linux-x64",
    "jwebgpu-jni-mac-x64",
    "jwebgpu-jni-mac-arm64",
]
