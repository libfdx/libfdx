name: Release

on:
  workflow_dispatch:
    inputs:
      autoPublish:
        description: Automatically publish the Central Portal deployment after validation.
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    uses: ./.github/workflows/workflow_build_and_upload.yml
    with:
      isRelease: true
      shouldUpload: true
      autoPublish: ${{ inputs.autoPublish }}
    secrets: inherit
