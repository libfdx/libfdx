name: Build and Upload

on:
  workflow_call:
    inputs:
      isRelease:
        required: true
        type: boolean
      shouldUpload:
        required: true
        type: boolean
      autoPublish:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
  CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}

jobs:
  build_windows:
    name: Build Windows Natives
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Build runtime fdx Windows native
        run: .\gradlew.bat --refresh-dependencies :libfdx:runtime:fdx:platform:desktop:generate_runtime_fdx_windows_native

      - name: Build shader compiler Windows native
        run: .\gradlew.bat --refresh-dependencies :libfdx:tools:shader:platform:desktop_ffm:generate_shaderc_desktop_native

      - name: Upload runtime fdx Windows native
        uses: actions/upload-artifact@v7
        with:
          name: runtime-fdx-desktop-windows-x64
          path: libfdx/runtime/fdx/platform/desktop/build/generated/resources/runtimeFdxDesktop/libfdx-native/desktop/windows-x64/fdx.dll
          if-no-files-found: error

      - name: Upload shader compiler Windows native
        uses: actions/upload-artifact@v7
        with:
          name: shader-compiler-desktop-windows-x86_64
          path: libfdx/tools/shader/platform/desktop_ffm/build/generated/resources/shaderc/libfdx/shader/native/desktop/windows-x86_64/fdx_shaderc.dll
          if-no-files-found: error

  build_linux:
    name: Build Linux Natives
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build runtime fdx Linux native
        run: ./gradlew --refresh-dependencies :libfdx:runtime:fdx:platform:desktop:generate_runtime_fdx_linux_native

      - name: Build shader compiler Linux native
        run: ./gradlew --refresh-dependencies :libfdx:tools:shader:platform:desktop_ffm:generate_shaderc_desktop_native

      - name: Upload runtime fdx Linux native
        uses: actions/upload-artifact@v7
        with:
          name: runtime-fdx-desktop-linux-x64
          path: libfdx/runtime/fdx/platform/desktop/build/generated/resources/runtimeFdxDesktop/libfdx-native/desktop/linux-x64/libfdx.so
          if-no-files-found: error

      - name: Upload shader compiler Linux native
        uses: actions/upload-artifact@v7
        with:
          name: shader-compiler-desktop-linux-x86_64
          path: libfdx/tools/shader/platform/desktop_ffm/build/generated/resources/shaderc/libfdx/shader/native/desktop/linux-x86_64/libfdx_shaderc.so
          if-no-files-found: error

  build_macos_x64:
    name: Build macOS x64 Natives
    runs-on: macos-26-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build runtime fdx macOS x64 native
        run: ./gradlew --refresh-dependencies :libfdx:runtime:fdx:platform:desktop:generate_runtime_fdx_macos_native

      - name: Build shader compiler macOS x64 native
        run: ./gradlew --refresh-dependencies :libfdx:tools:shader:platform:desktop_ffm:generate_shaderc_desktop_native

      - name: Upload runtime fdx macOS x64 native
        uses: actions/upload-artifact@v7
        with:
          name: runtime-fdx-desktop-macos-x64
          path: libfdx/runtime/fdx/platform/desktop/build/generated/resources/runtimeFdxDesktop/libfdx-native/desktop/macos-x64/libfdx.dylib
          if-no-files-found: error

      - name: Upload shader compiler macOS x64 native
        uses: actions/upload-artifact@v7
        with:
          name: shader-compiler-desktop-macos-x86_64
          path: libfdx/tools/shader/platform/desktop_ffm/build/generated/resources/shaderc/libfdx/shader/native/desktop/macos-x86_64/libfdx_shaderc.dylib
          if-no-files-found: error

  build_macos_arm64:
    name: Build macOS arm64 Natives
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build runtime fdx macOS arm64 native
        run: ./gradlew --refresh-dependencies :libfdx:runtime:fdx:platform:desktop:generate_runtime_fdx_macos_native

      - name: Build shader compiler macOS arm64 native
        run: ./gradlew --refresh-dependencies :libfdx:tools:shader:platform:desktop_ffm:generate_shaderc_desktop_native

      - name: Upload runtime fdx macOS arm64 native
        uses: actions/upload-artifact@v7
        with:
          name: runtime-fdx-desktop-macos-arm64
          path: libfdx/runtime/fdx/platform/desktop/build/generated/resources/runtimeFdxDesktop/libfdx-native/desktop/macos-arm64/libfdx.dylib
          if-no-files-found: error

      - name: Upload shader compiler macOS arm64 native
        uses: actions/upload-artifact@v7
        with:
          name: shader-compiler-desktop-macos-arm64
          path: libfdx/tools/shader/platform/desktop_ffm/build/generated/resources/shaderc/libfdx/shader/native/desktop/macos-arm64/libfdx_shaderc.dylib
          if-no-files-found: error

  build_web:
    name: Build Web Natives
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: latest

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build web native artifacts
        run: |
          ./gradlew --refresh-dependencies \
            :libfdx:runtime:fdx:platform:web:generate_runtime_fdx_web_native \
            :libfdx:tools:shader:platform:web:generate_shaderc_web_native

      - name: Upload runtime fdx web natives
        uses: actions/upload-artifact@v7
        with:
          name: runtime-fdx-web
          path: |
            libfdx/runtime/fdx/platform/web/build/generated/resources/runtimeFdxWeb/fdx.js
            libfdx/runtime/fdx/platform/web/build/generated/resources/runtimeFdxWeb/fdx.wasm
          if-no-files-found: error

      - name: Upload shader compiler web natives
        uses: actions/upload-artifact@v7
        with:
          name: shader-compiler-web
          path: |
            libfdx/tools/shader/platform/web/build/generated/resources/shaderc/libfdx/shader/native/web/libfdx_shaderc.js
            libfdx/tools/shader/platform/web/build/generated/resources/shaderc/libfdx/shader/native/web/libfdx_shaderc.wasm
          if-no-files-found: error

  build_android:
    name: Build Android Libraries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android native toolchain
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build Android library artifacts
        run: |
          ./gradlew --refresh-dependencies \
            :libfdx:runtime:fdx:platform:android:assembleRelease \
            :libfdx:backends:android:assembleRelease \
            :libfdx:extensions:graphics:vulkan:platform:android_jni:assembleRelease \
            :libfdx:extensions:graphics:wgpu:platform:android_jni:assembleRelease \
            :libfdx:tools:shader:platform:android_jni:assembleRelease

      - name: Upload Android library artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-native-artifacts
          path: |
            libfdx/runtime/fdx/platform/android/build/outputs/aar/*.aar
            libfdx/backends/android/build/outputs/aar/*.aar
            libfdx/extensions/graphics/vulkan/platform/android_jni/build/outputs/aar/*.aar
            libfdx/extensions/graphics/wgpu/platform/android_jni/build/outputs/aar/*.aar
            libfdx/tools/shader/platform/android_jni/build/outputs/aar/*.aar
          if-no-files-found: error

  publish:
    name: Build and Upload
    runs-on: ubuntu-latest
    needs:
      - build_windows
      - build_linux
      - build_macos_x64
      - build_macos_arm64
      - build_web
      - build_android
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Read fdxVersion
        id: version
        shell: bash
        run: |
          chmod +x ./gradlew
          value="$(./gradlew --refresh-dependencies -q printFdxVersion | grep -E '^[0-9]+(\.[0-9]+)*([.-][A-Za-z0-9]+)*$' | tail -n 1)"
          if [ -z "$value" ]; then
            echo "Could not read fdxVersion from Gradle output"
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "Version: $value"

      - name: Validate publish mode
        if: ${{ inputs.shouldUpload }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "libfdx.toml release.fdxVersion must contain the upcoming base version without -SNAPSHOT, got $version"
            exit 1
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android native toolchain
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Download runtime fdx Windows native
        uses: actions/download-artifact@v8
        with:
          name: runtime-fdx-desktop-windows-x64
          path: libfdx/runtime/fdx/platform/desktop/build/generated/resources/runtimeFdxDesktop/libfdx-native/desktop/windows-x64

      - name: Download runtime fdx Linux native
        uses: actions/download-artifact@v8
        with:
          name: runtime-fdx-desktop-linux-x64
          path: libfdx/runtime/fdx/platform/desktop/build/generated/resources/runtimeFdxDesktop/libfdx-native/desktop/linux-x64

      - name: Download runtime fdx macOS x64 native
        uses: actions/download-artifact@v8
        with:
          name: runtime-fdx-desktop-macos-x64
          path: libfdx/runtime/fdx/platform/desktop/build/generated/resources/runtimeFdxDesktop/libfdx-native/desktop/macos-x64

      - name: Download runtime fdx macOS arm64 native
        uses: actions/download-artifact@v8
        with:
          name: runtime-fdx-desktop-macos-arm64
          path: libfdx/runtime/fdx/platform/desktop/build/generated/resources/runtimeFdxDesktop/libfdx-native/desktop/macos-arm64

      - name: Download shader compiler Windows native
        uses: actions/download-artifact@v8
        with:
          name: shader-compiler-desktop-windows-x86_64
          path: libfdx/tools/shader/platform/desktop_ffm/build/generated/resources/shaderc/libfdx/shader/native/desktop/windows-x86_64

      - name: Download shader compiler Linux native
        uses: actions/download-artifact@v8
        with:
          name: shader-compiler-desktop-linux-x86_64
          path: libfdx/tools/shader/platform/desktop_ffm/build/generated/resources/shaderc/libfdx/shader/native/desktop/linux-x86_64

      - name: Download shader compiler macOS x64 native
        uses: actions/download-artifact@v8
        with:
          name: shader-compiler-desktop-macos-x86_64
          path: libfdx/tools/shader/platform/desktop_ffm/build/generated/resources/shaderc/libfdx/shader/native/desktop/macos-x86_64

      - name: Download shader compiler macOS arm64 native
        uses: actions/download-artifact@v8
        with:
          name: shader-compiler-desktop-macos-arm64
          path: libfdx/tools/shader/platform/desktop_ffm/build/generated/resources/shaderc/libfdx/shader/native/desktop/macos-arm64

      - name: Download runtime fdx web natives
        uses: actions/download-artifact@v8
        with:
          name: runtime-fdx-web
          path: libfdx/runtime/fdx/platform/web/build/generated/resources/runtimeFdxWeb

      - name: Download shader compiler web natives
        uses: actions/download-artifact@v8
        with:
          name: shader-compiler-web
          path: libfdx/tools/shader/platform/web/build/generated/resources/shaderc/libfdx/shader/native/web

      - name: Download Android build artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-native-artifacts
          path: libfdx

      - name: Verify downloaded native artifacts
        shell: bash
        run: |
          required_files=(
            "libfdx/runtime/fdx/platform/desktop/build/generated/resources/runtimeFdxDesktop/libfdx-native/desktop/windows-x64/fdx.dll"
            "libfdx/runtime/fdx/platform/desktop/build/generated/resources/runtimeFdxDesktop/libfdx-native/desktop/linux-x64/libfdx.so"
            "libfdx/runtime/fdx/platform/desktop/build/generated/resources/runtimeFdxDesktop/libfdx-native/desktop/macos-x64/libfdx.dylib"
            "libfdx/runtime/fdx/platform/desktop/build/generated/resources/runtimeFdxDesktop/libfdx-native/desktop/macos-arm64/libfdx.dylib"
            "libfdx/tools/shader/platform/desktop_ffm/build/generated/resources/shaderc/libfdx/shader/native/desktop/windows-x86_64/fdx_shaderc.dll"
            "libfdx/tools/shader/platform/desktop_ffm/build/generated/resources/shaderc/libfdx/shader/native/desktop/linux-x86_64/libfdx_shaderc.so"
            "libfdx/tools/shader/platform/desktop_ffm/build/generated/resources/shaderc/libfdx/shader/native/desktop/macos-x86_64/libfdx_shaderc.dylib"
            "libfdx/tools/shader/platform/desktop_ffm/build/generated/resources/shaderc/libfdx/shader/native/desktop/macos-arm64/libfdx_shaderc.dylib"
            "libfdx/runtime/fdx/platform/web/build/generated/resources/runtimeFdxWeb/fdx.js"
            "libfdx/runtime/fdx/platform/web/build/generated/resources/runtimeFdxWeb/fdx.wasm"
            "libfdx/tools/shader/platform/web/build/generated/resources/shaderc/libfdx/shader/native/web/libfdx_shaderc.js"
            "libfdx/tools/shader/platform/web/build/generated/resources/shaderc/libfdx/shader/native/web/libfdx_shaderc.wasm"
            "libfdx/runtime/fdx/platform/android/build/outputs/aar/fdx_android-release.aar"
            "libfdx/backends/android/build/outputs/aar/backend_android-release.aar"
            "libfdx/extensions/graphics/vulkan/platform/android_jni/build/outputs/aar/vulkan_android_jni-release.aar"
            "libfdx/extensions/graphics/wgpu/platform/android_jni/build/outputs/aar/wgpu_android_jni-release.aar"
            "libfdx/tools/shader/platform/android_jni/build/outputs/aar/shader_compiler_android_jni-release.aar"
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing native artifact: $file"
              exit 1
            fi
          done

      - name: Prepare release deploy files
        if: ${{ inputs.isRelease }}
        env:
          SIGNING_KEY: ${{ secrets.PGP_SECRET }}
          SIGNING_PASSWORD: ${{ secrets.PGP_PASSPHRASE }}
        run: ./gradlew --refresh-dependencies prepareReleaseDeploy

      - name: Upload release deploy files artifact
        uses: actions/upload-artifact@v7
        if: ${{ inputs.shouldUpload && inputs.isRelease }}
        with:
          name: release-staging-deploy-${{ steps.version.outputs.value }}
          path: |
            ./build/staging-deploy/
            ./build/staging-deploy.zip

      - name: Upload release to repository
        uses: nick-fields/retry@v4
        if: ${{ inputs.shouldUpload && inputs.isRelease }}
        env:
          SIGNING_KEY: ${{ secrets.PGP_SECRET }}
          SIGNING_PASSWORD: ${{ secrets.PGP_PASSPHRASE }}
          CENTRAL_PUBLISHING_TYPE: ${{ inputs.autoPublish && 'AUTOMATIC' || 'USER_MANAGED' }}
        with:
          max_attempts: 6
          timeout_minutes: 20
          retry_on: error
          command: ./gradlew --refresh-dependencies publishRelease

      - name: Prepare snapshot deploy files
        if: ${{ !inputs.isRelease }}
        run: ./gradlew --refresh-dependencies prepareSnapshotDeploy

      - name: Upload snapshot deploy files artifact
        uses: actions/upload-artifact@v7
        if: ${{ inputs.shouldUpload && !inputs.isRelease }}
        with:
          name: snapshot-deploy-SNAPSHOT-${{ github.run_number }}
          path: ./build/snapshot-deploy/

      - name: Upload snapshot to repository
        uses: nick-fields/retry@v4
        if: ${{ inputs.shouldUpload && !inputs.isRelease }}
        with:
          max_attempts: 6
          timeout_minutes: 30
          retry_on: error
          command: ./gradlew --refresh-dependencies publishSnapshot

      - name: Create Git tag
        uses: actions/github-script@v9
        if: ${{ inputs.shouldUpload && inputs.isRelease }}
        with:
          script: |
            const version = "${{ steps.version.outputs.value }}";
            const ref = "refs/tags/" + version;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                sha: context.sha
              });
            } catch (error) {
              if (error.status === 422) {
                core.info(`Tag ${version} already exists.`);
              } else {
                throw error;
              }
            }
